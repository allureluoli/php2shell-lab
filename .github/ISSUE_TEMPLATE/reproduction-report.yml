name: Reproduction report
description: You ran the lab and want to share the result — pass or fail
title: "[repro] PHP <version> / <SAPI>: <reproduced|not reproduced>"
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — negative results are as useful as positive ones here.
        Please attach the `evidence/*.log` files (drag them into the comment box).
  - type: input
    id: php
    attributes:
      label: PHP version(s)
      description: Output of `php -v` for both binaries you used
      placeholder: "8.4.16 (vulnerable) / 8.4.27 (fixed)"
    validations:
      required: true
  - type: input
    id: sapi
    attributes:
      label: SAPI / server
      placeholder: "cli-server (php -S), mod_php prefork, frankenphp, ..."
    validations:
      required: true
  - type: input
    id: knobs
    attributes:
      label: Knobs
      description: memory_limit and session size used
      placeholder: "MEMLIMIT=8M SESSBYTES=6000000"
  - type: dropdown
    id: lane
    attributes:
      label: Which lane
      options:
        - lab/quickstart.sh (plain builds)
        - lab/run-ab.sh (ASAN builds)
        - other (describe below)
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What the harness printed (verdict block), plus anything surprising
      render: text
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This was run against a machine I own or am authorised to test
          required: true
